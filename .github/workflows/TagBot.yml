name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.actor == 'JuliaTagBot' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '@JuliaRegistrator'))
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Push the tag over the deploy key, not GITHUB_TOKEN: a tag pushed with
          # GITHUB_TOKEN does not trigger other workflows, so Documenter's `tags: v*`
          # trigger would never fire and the `stable` docs would never be built.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
